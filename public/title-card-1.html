<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .container {
    text-align: center;
    max-width: 900px;
    padding: 60px;
  }
  .line1 {
    font-size: 42px;
    font-weight: 300;
    color: #9ca3af;
    letter-spacing: -0.5px;
    line-height: 1.3;
    margin-bottom: 16px;
  }
  .line2 {
    font-size: 52px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -1px;
    line-height: 1.2;
  }
  .accent { color: #1a73e8; }
</style>
</head>
<body>
  <div class="container">
    <div class="line1">The medical knowledge is never the problem.</div>
    <div class="line2">The <span class="accent">system</span> is.</div>
  </div>
</body>
</html>
