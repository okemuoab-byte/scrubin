<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  .container { text-align: center; max-width: 900px; padding: 60px; }

  .line1 {
    font-size: 40px;
    font-weight: 300;
    color: #9ca3af;
    letter-spacing: -0.5px;
    line-height: 1.3;
    margin-bottom: 20px;
    opacity: 0;
    transform: translateY(20px);
    animation: rise 0.9s ease forwards 0.3s;
  }
  .line2 {
    font-size: 54px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -1.5px;
    line-height: 1.2;
    opacity: 0;
    transform: translateY(20px);
    animation: rise 0.9s ease forwards 1.0s;
  }
  .accent {
    color: #1a73e8;
    animation: rise 0.9s ease forwards 1.0s, pulse 2.5s ease-in-out infinite 2.2s;
  }
  .bar {
    width: 0;
    height: 3px;
    background: #1a73e8;
    margin: 28px auto 0;
    border-radius: 2px;
    animation: expand 0.8s ease forwards 1.8s;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes expand {
    to { width: 80px; }
  }
  @keyframes pulse {
    0%, 100% { color: #1a73e8; }
    50% { color: #4a9eff; text-shadow: 0 0 30px rgba(26,115,232,0.5); }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="line1">The medical knowledge is never the problem.</div>
    <div class="line2">The <span class="accent">system</span> is.</div>
    <div class="bar"></div>
  </div>
</body>
</html>
