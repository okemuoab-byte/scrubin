<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  .container { text-align: center; padding: 60px; }

  .logo {
    font-size: 72px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -3px;
    line-height: 1;
    opacity: 0;
    transform: translateY(20px);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
    margin-bottom: 20px;
  }
  .logo .blue { color: #1a73e8; }

  .url {
    font-size: 28px;
    font-weight: 400;
    color: #1a73e8;
    letter-spacing: 0;
    opacity: 0;
    animation: fadein 0.8s ease forwards 0.9s;
    margin-bottom: 32px;
  }

  .divider {
    width: 0;
    height: 1px;
    background: #2a2a2a;
    margin: 0 auto 28px;
    animation: expand 0.8s ease forwards 1.4s;
  }

  .meta {
    font-size: 13px;
    font-weight: 400;
    color: #4b5563;
    letter-spacing: 1px;
    opacity: 0;
    animation: fadein 0.8s ease forwards 1.6s;
    line-height: 1.8;
  }
  .meta strong {
    color: #6b7280;
    font-weight: 500;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadein {
    to { opacity: 1; }
  }
  @keyframes expand {
    to { width: 200px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">Scrub<span class="blue">In</span></div>
    <div class="url">scrubin-psi.vercel.app</div>
    <div class="divider"></div>
    <div class="meta">
      <strong>Built with Claude Opus 4.7</strong><br>
      Cerebral Valley x Anthropic Hackathon 2026<br>
      Arinze Okemuo · UCL Medical Student
    </div>
  </div>
</body>
</html>
