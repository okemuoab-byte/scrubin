<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .container {
    text-align: center;
    padding: 60px;
  }
  .eyebrow {
    font-size: 16px;
    font-weight: 500;
    color: #6b7280;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .logo {
    font-size: 96px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -4px;
    line-height: 1;
    margin-bottom: 24px;
  }
  .logo span { color: #1a73e8; }
  .tagline {
    font-size: 22px;
    font-weight: 300;
    color: #9ca3af;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">Introducing</div>
    <div class="logo">Scrub<span>In</span></div>
    <div class="tagline">Navigate any clinical system with AI</div>
  </div>
</body>
</html>
